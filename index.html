<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaflet Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+e2atTYnA2g9zXBJgp7wa9l1sXkGumZ5p3y+4yRyk="
    crossorigin=""
  />

  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh; /* full screen */
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-SmHgwlHGhP0Q0Q5lHGeOqxg+XoZbQyXgkqS1H2yZ5uA="
    crossorigin=""
  ></script>

  <div id="map"></div>

<script>
  const map = L.map("map", {
    crs: L.CRS.Simple, // simple coordinate system
    minZoom: -1
  });

  // Image dimensions in pixels
  const imageWidth = 8192;
  const imageHeight = 5056;
  const imageUrl = "druecia_yearsbeyond_small.jpg"; // replace with your image filename

  // Define map bounds (top-left to bottom-right)
  const bounds = [[0,0], [imageHeight, imageWidth]];
  L.imageOverlay(imageUrl, bounds).addTo(map);

  map.fitBounds(bounds);
</script>
</body>
</html>
